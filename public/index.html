<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agent World</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%235ad1ff'/%3E%3Cpath d='M16 6l9 5v10l-9 5-9-5V11z' fill='%23fff'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/css/app.css">
  <script type="importmap">
    { "imports": { "three": "/vendor/three/three.module.js", "three/addons/": "/vendor/three-addons/" } }
  </script>
</head>
<body>
  <div id="stage">
    <canvas id="scene"></canvas>
    <div id="labels"></div>
  </div>

  <header class="topbar">
    <div class="brand"><span class="logo"></span>Agent World</div>
    <span class="pill" id="mode">…</span>
    <div class="grow"></div>
    <div class="stats" id="stats"></div>
    <select class="lang-select" id="lang" title="Language" data-i18n-title="html.language"><option value="en">EN</option></select>
    <button class="icon-btn" id="btn-theme" title="Day / night" data-i18n-title="html.theme">☀</button>
    <button class="icon-btn" id="btn-home" title="Full view" data-i18n-title="html.home">⌂</button>
    <button class="icon-btn" id="btn-left" title="Mission" data-i18n-title="html.left">☰</button>
    <button class="icon-btn" id="btn-right" title="Panel" data-i18n-title="html.right">▤</button>
    <button class="icon-btn" id="btn-settings" title="Settings" data-i18n-title="html.settings">⚙</button>
  </header>

  <aside class="panel left" id="left">
    <section class="mission">
      <h2 data-i18n="html.newMission">New mission</h2>
      <div class="composer" data-drop="goal">
        <textarea id="goal" rows="4" data-i18n-placeholder="html.goal" placeholder="What should the company do? E.g. the complete launch website for my yoga studio, with images and copy"></textarea>
        <button class="mic" id="goal-mic" title="Dictate the goal" data-i18n-title="html.dictate">🎙</button>
        <button class="mic attach" data-attach="goal" title="Attach files (or drop / paste them here)" data-i18n-title="html.attach">📎</button>
      </div>
      <div class="att-chips" data-chips="goal"></div>
      <div class="chips" id="examples"></div>
      <label class="check"><input type="checkbox" id="approve-plan"> <span data-i18n="html.approve">I want to approve the plan before they start</span></label>
      <button class="primary" id="btn-start">Start the company</button>
    </section>
    <section id="waiting" class="waiting hidden"></section>
    <section id="current"></section>
    <section id="refine" class="refine hidden" data-drop="refine">
      <h3 data-i18n="html.refineTitle">Talk to the team or ask for a change</h3>
      <textarea id="refine-text" rows="2" placeholder="E.g. I don&#39;t like the hero: use the photo I attach and change the title to …" data-i18n-placeholder="html.refinePlaceholder"></textarea>
      <div class="att-chips" data-chips="refine"></div>
      <div class="row"><button class="mic attach" data-attach="refine" title="Attach files (or drop / paste them here)" data-i18n-title="html.attach">📎</button><button class="btn go" id="refine-send" data-i18n="html.refineSend">Send</button></div>
    </section>
    <section class="history">
      <h3 data-i18n="html.history">Previous runs</h3>
      <div id="runs"></div>
    </section>
  </aside>

  <aside class="panel right" id="right">
    <nav class="tabs" id="tabs">
      <button data-tab="board" class="active" data-i18n="html.tab.board">Tasks</button>
      <button data-tab="comms" data-i18n="html.tab.comms">Messages</button>
      <button data-tab="teams" data-i18n="html.tab.teams">Teams</button>
      <button data-tab="skills" data-i18n="html.tab.skills">Skills</button>
      <button data-tab="brain" data-i18n="html.tab.brain">Brain</button>
      <button data-tab="router" data-i18n="html.tab.router">Router</button>
      <button data-tab="output" data-i18n="html.tab.output">Output</button>
    </nav>
    <div class="tab-body" id="tab-board"></div>
    <div class="tab-body hidden" id="tab-comms"></div>
    <div class="tab-body hidden" id="tab-teams"></div>
    <div class="tab-body hidden" id="tab-skills"></div>
    <div class="tab-body hidden" id="tab-brain"></div>
    <div class="tab-body hidden" id="tab-router"></div>
    <div class="tab-body hidden" id="tab-output"></div>
  </aside>

  <footer class="roster" id="roster"></footer>
  <canvas class="minimap" id="minimap" width="204" height="184" title="Map: click to move there" data-i18n-title="html.minimap"></canvas>
  <div class="inspector hidden" id="inspector"></div>

  <div class="modal hidden" id="settings"><div class="sheet" id="settings-body"></div></div>
  <div class="modal hidden" id="viewer"><div class="sheet wide" id="viewer-body"></div></div>
  <div class="modal hidden" id="login"></div>
  <div class="toasts" id="toasts"></div>
  <input type="file" id="file-picker" multiple hidden accept=".png,.jpg,.jpeg,.webp,.svg,.gif,.pdf,.docx,.txt,.md,.csv,.json,.html,.htm,.css,.js,.mp3,.wav,.ogg">

  <script type="module" src="/js/main.js"></script>
</body>
</html>
