[project]
name = "agent-world-backend"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    # uvicorn without [standard]: no websockets, pyyaml or python-dotenv (unused here).
    # httptools is picked up by uvicorn automatically; watchfiles serves `npm run dev` --reload.
    "uvicorn>=0.32",
    "httptools>=0.6",
    "watchfiles>=0.24",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "maturin>=1.7",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]
